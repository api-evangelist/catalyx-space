aid: catalyx-space
name: Catalyx Space
description: >-
  Catalyx Space Inc. is a San Francisco based space infrastructure company
  building an integrated platform for deploying payloads to low Earth orbit and
  returning them safely to the ground. The company develops autonomous orbital
  labs and reusable reentry vehicles (ReX) that use origami-inspired hypersonic
  decelerator technology to deliver heavy-mass downmass from orbit to ocean
  recovery zones, positioning itself as the fastest and most affordable way to
  deploy experiments and manufacture in orbit. Catalyx handles end-to-end space
  operations including spacecraft development, payload integration, launch
  logistics, mission control, and recovery. Surfaced as a Techstars (and
  Outlander) portfolio company and added to the API Evangelist network for
  enrichment; the company currently publishes a marketing and careers presence
  but no public developer API surface.
